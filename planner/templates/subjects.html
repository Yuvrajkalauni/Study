{% extends "layout.html" %}

{% block content %}
<h2>Subjects</h2>

<form method="post">
  {% csrf_token %}
  <input class="form-control mb-2" name="name" placeholder="Subject name">
  <button class="btn btn-primary">Add</button>
</form>

<ul class="mt-3">
  {% for subject in subjects %}
    <li>{{ subject.name }}</li>
  {% endfor %}
</ul>
{% endblock %}
